name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: hbserve --version
      - run: hbserve capabilities
      - run: python -B tests/test_hbserve.py
      - run: python -B tests/test_windows.py
      - run: python -B tests/test_session_compatibility.py

  native-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: FlashLab-MBZUAI/HBFSim
          ref: e9ddd1c8980d56f9f6a14e5241fb7903b6b6636c
          path: backend
      - name: Build pinned public backend
        working-directory: backend
        run: python3 -B -m hbfsim build --jobs 2
      - name: Bundled client and native serving
        run: |
          python3 -B tests/test_config_compatibility.py --hbfsim-root backend --simulator backend/build/hbfsim --client bundled
          python3 -B tests/test_hbserve.py --simulator backend/build/hbfsim
          python3 -B tests/test_session_compatibility.py --simulator backend/build/hbfsim
          python3 -B tests/test_windows.py --simulator backend/build/hbfsim
      - name: External source client
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          python3 -B tests/test_config_compatibility.py --hbfsim-root backend --simulator backend/build/hbfsim --client external
          python3 -B tests/test_hbserve.py --simulator backend/build/hbfsim
